<article class="article-card"><a href="{% url 'article' item.slug %}" class="article-card-link">{% if item.image %}<img class="article-image" src="{{ item.image.url }}" alt="{{ item.image_alt }}" loading="lazy">{% else %}<div class="article-placeholder">{% include 'components/icon.html' with name='book' %}<span>{{ item.category }}</span></div>{% endif %}<div class="article-card-body"><p class="article-meta">{{ item.category }} <span>·</span> {{ item.published_at|date:'d M Y' }}</p><h3>{{ item.title }}</h3><p>{{ item.excerpt }}</p><span class="text-link">Read article {% include 'components/icon.html' with name='chevron' %}</span></div></a></article>
