{% if items.has_other_pages %}<nav aria-label="Result pages" class="pagination">{% if items.has_previous %}<a class="text-link" href="?page={{ items.previous_page_number }}&q={{ query|urlencode }}&state={{ state|urlencode }}">Previous</a>{% endif %}<span>Page {{ items.number }} of {{ items.paginator.num_pages }}</span>{% if items.has_next %}<a class="text-link" href="?page={{ items.next_page_number }}&q={{ query|urlencode }}&state={{ state|urlencode }}">Next</a>{% endif %}</nav>{% endif %}
