{% if school.admissions_open %}<a class="button {{ action_class }}" href="{% url 'apply' %}"{% if request.resolver_match.url_name == 'apply' %} aria-current="page"{% endif %}>{{ action_label|default:'Admissions' }} <span aria-hidden="true">→</span></a>{% elif school.phone %}<a class="button {{ action_class }}" href="tel:{{ school.phone }}">{% include 'components/icon.html' with name='phone' %}Call us</a>{% else %}<a class="button {{ action_class }}" href="{% url 'contact' %}">{% include 'components/icon.html' with name='mail' %}Contact us</a>{% endif %}
