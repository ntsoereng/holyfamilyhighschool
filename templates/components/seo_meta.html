<meta name="description" content="{{ seo.description }}">
{% if school_json_ld %}<script type="application/ld+json">{{ school_json_ld|safe }}</script>{% endif %}
<meta name="robots" content="{{ seo.robots }}">
{% if seo.canonical %}<link rel="canonical" href="{{ seo.canonical }}">{% endif %}
<meta property="og:site_name" content="{{ seo.site_name }}">
<meta property="og:type" content="{{ seo.og_type }}">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:locale" content="{{ seo.locale }}">
{% if seo.canonical %}<meta property="og:url" content="{{ seo.canonical }}">{% endif %}
{% if seo.image %}<meta property="og:image" content="{{ seo.image }}"><meta property="og:image:alt" content="{{ seo.image_alt }}">{% endif %}
{% if seo.published_at %}<meta property="article:published_time" content="{{ seo.published_at|date:'c' }}">{% endif %}
<meta name="twitter:card" content="{% if seo.image %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
{% if seo.canonical %}<meta name="twitter:url" content="{{ seo.canonical }}">{% endif %}
{% if seo.image %}<meta name="twitter:image" content="{{ seo.image }}"><meta name="twitter:image:alt" content="{{ seo.image_alt }}">{% endif %}
